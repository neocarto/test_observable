```html
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Test Observable</title>
</head>
<body>
  <h1>Test d'intégration Observable</h1>
  <div id="status">Chargement du module…</div>
  <div id="controls"></div>
  <div id="map"></div>

  <script type="module">
    const status = document.querySelector("#status");

    try {
      status.textContent = "Import du runtime…";

      const {Runtime} = await import(
        "https://cdn.jsdelivr.net/npm/@observablehq/runtime@6/+esm"
      );

      const {Inspector} = await import(
        "https://cdn.jsdelivr.net/npm/@observablehq/inspector@5/+esm"
      );

      status.textContent = "Import du notebook…";

      const {default: define} = await import(
        "./mon-notebook.js"
      );

      status.textContent = "Exécution du notebook…";

      const runtime = new Runtime();

      runtime.module(define, name => {
        if (name === "cell 10") {
          status.textContent = "Cellule du curseur détectée";
          return new Inspector(document.querySelector("#controls"));
        }

        if (name === "cell 5") {
          status.textContent = "Cellule de carte détectée";
          return new Inspector(document.querySelector("#map"));
        }
      });

    } catch (error) {
      status.textContent = "ERREUR : " + error.message;
      console.error(error);
    }
  </script>
</body>
</html>
